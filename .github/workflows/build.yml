name: test
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - '**'
    tags:
      - '*.*'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x, 24.x ]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: install
        run: npm ci
      - name: lint
        run: npm run lint
      - name: test (CommonJS and ES modules)
        run: npm test
        env:
          CI: true
      - name: test the package (exports map, browser bundle, types)
        run: npm run test:package
